  max_depth: 1
  max_pages: 1900
  profile_link_limit: 1700
  profile_links_from_parsed_people_only: true
  crawl_delay_seconds: 0.5
  use_homepage_discovery: false
  allow_serp: false
  respect_robots_txt: true
  profile_url_patterns: [/people/academic-staff/, /people/academic-and-teaching-staff/, /people/academic-teaching-staff/, /people/research-assistant-professor/]
  exclude_url_patterns: [supporting-staff, research-students]

parsing:
  extract_publication_fingerprints: true
  preferred_adapters: [polyu_academic_directory]
  profile_adapters: [elsevier_pure_person, generic_html]

capture:
  archive_enabled: true
  compression: gzip
  conditional_requests: true
  missing_runs_before_inactive: 2

refresh:
  directory_interval_days: 30
  profile_interval_days: 90

quality_gate:
  minimum_people: 700
  maximum_duplicate_rate: 0.08
  minimum_profile_url_coverage: 0.90
  minimum_seed_url_coverage: 0.98
  minimum_unit_coverage: 1.0
  minimum_profile_fetch_coverage: 0.95
  minimum_profile_parse_coverage: 1.0
  require_profile_follow: true
  require_pagination_complete: true

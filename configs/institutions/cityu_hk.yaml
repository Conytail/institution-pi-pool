    Yawei ZHANG: https://scholars.cityu.edu.hk/en/persons/yzhan72/
    CHEN Youhua: https://scholars.cityu.edu.hk/en/persons/youhchen/
    Chaojie LI: https://scholars.cityu.edu.hk/en/persons/chaojili/
    Yuechuan TAO: https://scholars.cityu.edu.hk/en/persons/yuechtao/
    CHEN Hesheng: https://scholars.cityu.edu.hk/en/persons/heshchen/
    Jingshan LI: https://scholars.cityu.edu.hk/en/persons/jingshli/
    Qi QIN: https://scholars.cityu.edu.hk/en/persons/qiqin32/
    Wei Ting WANG: https://scholars.cityu.edu.hk/en/persons/wtwang/
    Dan PRIEL: https://scholars.cityu.edu.hk/en/persons/dspriel/

capture: &capture
  archive_enabled: true
  compression: gzip
  conditional_requests: true
  missing_runs_before_inactive: 2

refresh: &refresh
  directory_interval_days: 30
  profile_interval_days: 90

quality_gate:
  minimum_people: 500
  maximum_duplicate_rate: 0.05
  minimum_profile_url_coverage: 0.75
  minimum_seed_url_coverage: 1.0
  minimum_unit_coverage: 1.0
  minimum_profile_fetch_coverage: 0.95
  minimum_profile_parse_coverage: 0.95
  require_profile_follow: true
  require_pagination_complete: true

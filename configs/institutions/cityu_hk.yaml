  max_pages: 1400
  profile_link_limit: 1200
  profile_links_from_parsed_people_only: true
  # These legacy personal-page families currently return Incapsula challenge
  # documents to the declared crawler. Their official department directories
  # remain the person-local source for names, appointments, email and research.
  exclude_url_patterns:
    - cityu.edu.hk/bms/profile/
    - cityu.edu.hk/bme/staff-distinguished.htm
    - cityu.edu.hk/neuro/profile/
    - cityu.edu.hk/neuro/jufanghe.htm
    - cityu.edu.hk/stfprofile/
    # These legacy families returned only an Incapsula challenge to the
    # declared crawler in the audited run.  Their official directory rows are
    # already person-local and contain the appointment/contact evidence.
    - cityu.edu.hk/com/Profile.aspx
    - cityu.edu.hk/com/Page.aspx
    - cityu.edu.hk/lc/profiles/
    - cityu.edu.hk/vcs/staff/
    # Management detail URLs are identical client-rendered shells; the three
    # official JSON API seeds are the substantive person/research source.
    - cb.cityu.edu.hk/mgt/about-us/faculty-staff/detail
    # Stale/non-person links observed in official directory cards.  Keep them
    # out of profile coverage rather than replaying a known 403/404 document.
    - scholars.cityu.edu.hk/en/persons/chunyzhi
    - scholars.cityu.edu.hk/en/persons/fenglfan
    - scholars.cityu.edu.hk/en/persons/junfan
    - scholars.cityu.edu.hk/en/persons/154f5f2b-cf56-44b9-ba74-68177bf79b6c
    - scholars.cityu.edu.hk/en/persons/mengyin-jiang(
    - scholars.cityu.edu.hk/en/persons/chuk-ling-julian-lai(
    - scholars.cityu.edu.hk/person/markwong
    - cityu.edu.hk/scholar
    # Exact legacy placeholders verified from their archived response bodies:
    # the three EE URLs are 312-byte redirect stubs and the DS URL is a
    # 1.4-kilobyte client-navigation shell.  Neighbouring substantive EE
    # tilde homepages remain crawlable and are covered by a queue regression.
    - ee.cityu.edu.hk/~hangwong/
    - ee.cityu.edu.hk/~rosachan/
    - ee.cityu.edu.hk/~schan
    - ds.cityu.edu.hk/en/people/academic-staff/professor-jonathan-zhu
  crawl_delay_seconds: 1.0
  use_homepage_discovery: false
  allow_serp: false
  respect_robots_txt: true

parsing:
  extract_publication_fingerprints: true
  preferred_adapters: [cityu_federated_directory]
  # Some official profile links resolve to multi-person faculty cards (for
  # example the English Department adjunct page).  Keep the federated parser
  # in the profile chain so those cards remain separate people.
  profile_adapters: [elsevier_pure_person, cityu_multi_person_profile, cityu_person_profile, generic_html]
  profile_overrides:
    "HOU, Junhui David": https://www.cityu.edu.hk/stfprofile/csjhhou.htm
    Guangdong BAI: https://scholars.cityu.edu.hk/en/persons/guangbai/

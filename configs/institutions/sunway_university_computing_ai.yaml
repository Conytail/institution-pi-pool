schema_version: 2
config_version: 2

institution:
  name: Sunway University
  country: Malaysia
  region: Asia
  ror_id: https://ror.org/04mjt7f73
  homepage_url: https://sunwayuniversity.edu.my
  official_domains:
    - sunwayuniversity.edu.my
    - sunway.edu.my
  allowed_email_domains:
    - sunway.edu.my
    - sunwayuniversity.edu.my

pool_scope:
  type: multi_unit
  name: Computing, Artificial Intelligence, Engineering and Technology
  population: academic_and_research_personnel
  units:
    - name: School of Computing and Artificial Intelligence
      seed_urls:
        - https://sunwayuniversity.edu.my/staff-profiles
        - https://sunwayuniversity.edu.my/staff-profiles/school/School%20of%20Computing%20and%20Artificial%20Intelligence
        - https://sunwayuniversity.edu.my/school-of-computing-and-artificial-intelligence/staff-profiles
    - name: Faculty of Engineering and Technology
      seed_urls:
        - https://sunwayuniversity.edu.my/faculty-of-engineering-and-technology/staff-profiles

site:
  template_family: sunway_drupal_staff_v1

crawl:
  seed_urls:
    - https://sunwayuniversity.edu.my/staff-profiles
    - https://sunwayuniversity.edu.my/staff-profiles/school/School%20of%20Computing%20and%20Artificial%20Intelligence
    - https://sunwayuniversity.edu.my/school-of-computing-and-artificial-intelligence/staff-profiles
    - https://sunwayuniversity.edu.my/faculty-of-engineering-and-technology/staff-profiles
  max_depth: 1
  max_pages: 40
  profile_link_limit: 36
  crawl_delay_seconds: 0.5
  respect_robots_txt: false
  allow_serp: false
  profile_link_text_patterns:
    - View Profile
  profile_url_patterns:
    - /school-of-computing-and-artificial-intelligence/staff-profiles/
    - /school-of-engineering/staff-profiles/
    - /faculty-of-engineering-and-technology/staff-profiles/
  exclude_url_patterns:
    - /cdn-cgi/
    - "?"

parsing:
  extract_publication_fingerprints: true
  preferred_adapters:
    - jsonld_person
    - faculty_directory
    - mailto_profile
    - generic_html

capture:
  archive_enabled: true
  compression: gzip
  conditional_requests: true
  missing_runs_before_inactive: 2

refresh:
  directory_interval_days: 30
  profile_interval_days: 90

quality_gate:
  minimum_people: 5
  maximum_duplicate_rate: 0.10
  minimum_profile_url_coverage: 0.70
  minimum_seed_url_coverage: 1.0
  minimum_unit_coverage: 1.0
  minimum_profile_fetch_coverage: 0.90
  minimum_profile_parse_coverage: 0.70
  require_pagination_complete: true

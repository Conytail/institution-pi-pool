  seed_requests:
    - url: https://english.hku.hk/ajax/frontend/data_people.php
      method: POST
      form_data:
        request: "1"
        has_cat: All
        staff_cat: Faculty
  max_depth: 1
  max_pages: 3000
  profile_link_limit: 2500
  profile_links_from_parsed_people_only: true
  crawl_delay_seconds: 0.5
  use_homepage_discovery: false
  allow_serp: false
  respect_robots_txt: true
  pagination_link_text_patterns: [next, next page]
  pagination_url_patterns: ["?pg=", "/page"]
  exclude_url_patterns:
    # This is one shared honorary-professor collection, not a person profile.
    - https://www.web.smlc.hku.hk/honorary-professors

parsing:
  extract_publication_fingerprints: true
  preferred_adapters: [hku_multi_template_directory]
  profile_adapters: [hku_federated_profile]

capture:
  archive_enabled: true
  compression: gzip
  conditional_requests: true
  missing_runs_before_inactive: 2

refresh:
  directory_interval_days: 30
  profile_interval_days: 90

quality_gate:
  minimum_people: 1200
  maximum_duplicate_rate: 0.12
  minimum_profile_url_coverage: 0.85
  minimum_seed_url_coverage: 0.95
  minimum_unit_coverage: 1.0
  minimum_profile_fetch_coverage: 1.0
  minimum_profile_parse_coverage: 1.0
  require_profile_follow: true
  require_pagination_complete: true

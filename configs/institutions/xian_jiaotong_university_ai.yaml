schema_version: 2
config_version: 2

institution:
  name: Xi'an Jiaotong University
  aliases:
    - 西安交通大学
    - XJTU
  country: China
  region: Asia
  ror_id: https://ror.org/017zhmm22
  homepage_url: https://www.xjtu.edu.cn
  official_domains:
    - xjtu.edu.cn
  allowed_email_domains:
    - xjtu.edu.cn
    - mail.xjtu.edu.cn

pool_scope:
  type: school
  name: School of Artificial Intelligence faculty
  population: academic_and_research_personnel

site:
  template_family: xjtu_teacher_directory_v1

crawl:
  seed_urls:
    - https://www.xjtu.edu.cn/list_content.jsp?urltype=tree.TreeTempUrl&wbtreeid=1669&wbxjtucollegeid=904&flag=yuanxi
  max_depth: 1
  max_pages: 40
  profile_link_limit: 40
  crawl_delay_seconds: 2.0
  timeout_seconds: 45
  max_retries: 4
  backoff_seconds: 3.0
  respect_robots_txt: false
  allow_serp: false
  use_homepage_discovery: false
  profile_url_patterns:
    - jsnr.jsp?urltype=tree.TreeTempUrl&wbtreeid=1632&wbwbxjtuteacherid=
  exclude_url_patterns:
    - "#"
    - "javascript:"
    - "mailto:"

parsing:
  extract_publication_fingerprints: true
  preferred_adapters:
    - xjtu_teacher_profile
  default_title: 博士生导师
  default_department: 人工智能学院

capture:
  archive_enabled: true
  compression: gzip
  conditional_requests: true
  missing_runs_before_inactive: 2

refresh:
  directory_interval_days: 30
  profile_interval_days: 90

quality_gate:
  minimum_people: 5
  maximum_duplicate_rate: 0.10
  minimum_profile_url_coverage: 0.70
  minimum_seed_url_coverage: 1.0
  minimum_unit_coverage: 1.0
  minimum_profile_fetch_coverage: 0.90
  minimum_profile_parse_coverage: 0.70
  require_pagination_complete: true

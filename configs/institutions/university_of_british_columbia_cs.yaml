schema_version: 2
config_version: 2

institution:
  name: University of British Columbia
  country: Canada
  region: North America
  ror_id: https://ror.org/03rmrcq20
  homepage_url: https://www.cs.ubc.ca
  official_domains:
    - cs.ubc.ca
    - ubc.ca
  allowed_email_domains:
    - cs.ubc.ca
    - ubc.ca

pool_scope:
  type: department
  name: Computer Science faculty
  population: academic_and_research_personnel

site:
  template_family: generic_faculty_directory_v1

crawl:
  seed_urls:
    - https://www.cs.ubc.ca/people/faculty
  max_depth: 1
  max_pages: 6
  crawl_delay_seconds: 0.5

parsing:
  extract_publication_fingerprints: true
  preferred_adapters:
    - jsonld_person
    - faculty_directory
    - mailto_profile
    - generic_html

capture:
  archive_enabled: true
  compression: gzip
  conditional_requests: true
  missing_runs_before_inactive: 2

refresh:
  directory_interval_days: 30
  profile_interval_days: 90

quality_gate:
  minimum_people: 5
  maximum_duplicate_rate: 0.10
  minimum_profile_url_coverage: 0.70
  minimum_seed_url_coverage: 1.0
  minimum_unit_coverage: 1.0
  minimum_profile_fetch_coverage: 0.90
  minimum_profile_parse_coverage: 0.70
  require_pagination_complete: true

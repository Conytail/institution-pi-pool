schema_version: 1
manifest_version: 1
institution_id: hku
checked_at: "2026-07-14"
baseline_tag: baseline-v0.1

identity:
  official_name: The University of Hong Kong
  ror_id: https://ror.org/02zhqgq86
  homepage_url: https://www.hku.hk
  official_domains: [hku.hk]

scope:
  type: institution
  name: Whole institution
  population: academic_and_research_personnel
  inclusion_rule: Academic and research staff listed by official academic or research units, regardless of title; preserve appointment status as metadata.
  exclusions:
    - Current students and research postgraduate profiles
    - Administrative staff without an academic or research appointment
  membership_policy: Include official academic and research staff without inferring eligibility from title; contact and appointment review remain separate.
  research_unit_policy: Use validated official faculty and school directories as the person backbone; include cross-faculty schools with deduplication and use RPg units for coverage checks.

sources:
  - source_id: academic_structure
    role: organizational_scope
    url: https://www.hku.hk/faculties/
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Official faculty, school, department and centre index.
  - source_id: scholar_hub
    role: research_profile
    url: https://hub.hku.hk/advanced-search?location=crisrp
    official: true
    access_state: browser_only
    observed_http_status: 403
    note: HKU Scholars Hub staff search; browser retrieval succeeds while the generic automated probe meets an anti-bot page.
  - source_id: scholars_hub_architecture
    role: people_and_research_directory
    url: https://hub.hku.hk/simple-search?location=crisrp&filter_field_1=faculty&filter_type_1=authority&filter_value_1=ou00005
    official: true
    access_state: archived_official_snapshot
    observed_http_status: 403
    note: Faculty authority filter returned 109 profiles over three archived official pages; on 2026-07-14 both the generic client and browser were refused by the current edge layer, so existing records must be carried forward without pretending that details were refreshed.
  - source_id: cds_academic_staff
    role: people_directory
    url: https://www.cds.hku.hk/about/academic-staff/
    official: true
    access_state: archived_official_snapshot
    observed_http_status: 0
    note: The current generic crawler is disallowed by the site's robots policy; retain the last archived official directory snapshot and do not bypass the policy.
  - source_id: federated_people_directories
    role: people_directory
    url: https://arts.hku.hk/about-us/find-an-expert/
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Representative reachable directory in the federated faculty-and-school source set captured by the HKU Adapter Config v2.
  - source_id: research_degrees
    role: research_degree
    url: https://gradsch.hku.hk/prospective_students/research_areas
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Graduate School lists faculties, departments and interdisciplinary areas admitting research postgraduates.


  - {unit_id: school_innovation, name: School of Innovation, unit_type: cross_faculty_school, scope_status: include_with_deduplication, evidence_source_id: research_degrees}

coverage:
  unit_inventory_granularity: top_level_and_cross_faculty_academic_units
  top_level_unit_count: 14
  all_top_level_units_accounted_for: true
  people_source_present: true
  research_degree_evidence_present: true
  discovery_status: complete
  adapter_readiness: ready

adapter_assessment:
  coverage_strategy: Federated official faculty and school directories form the backbone; the official Scholars Hub faculty filter covers Architecture where the faculty subdomain blocks generic crawlers, and every top-level and RPg-admitting cross-faculty unit remains measurable.
  template_hypotheses:
    - {source_id: federated_people_directories, template_family: hku_federated_academic_directories_v1, confidence: high}
  known_constraints:
    - The Architecture faculty subdomain disallows generic crawlers; the official Scholars Hub faculty filter is used instead.
    - Scholars Hub currently refuses both the generic automated HTTP client and the available browser session; its last archived official snapshot is protected from false removal.
    - The CDS directory currently disallows the generic crawler; its last archived official snapshot is protected from false removal rather than fetched through a bypass.
    - Faculty and school directories use multiple HTML, Wix, Sitecore and JSON response templates.
    - Cross-faculty schools create duplicate affiliations and require canonical person deduplication.
    - Clinical and honorary appointments remain included; contact and appointment status are reported independently.
  next_step: Run the Adapter Config v2 and validate people count, source coverage, deduplication and profile URL coverage gates.

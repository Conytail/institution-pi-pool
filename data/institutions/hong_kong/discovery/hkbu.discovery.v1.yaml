schema_version: 1
manifest_version: 1
institution_id: hkbu
checked_at: "2026-07-13"
baseline_tag: baseline-v0.1

identity:
  official_name: Hong Kong Baptist University
  ror_id: https://ror.org/0145fw131
  homepage_url: https://www.hkbu.edu.hk
  official_domains: [hkbu.edu.hk]

scope:
  type: institution
  name: Whole institution
  population: academic_and_research_personnel
  inclusion_rule: Academic and research staff listed by official academic or research units, regardless of title; preserve appointment status as metadata.
  exclusions:
    - Current students and research postgraduate profiles
    - Administrative staff without an academic or research appointment
  membership_policy: Include official academic and research staff without inferring eligibility from title; contact and appointment review remain separate.
  research_unit_policy: Use the university research portal as the person backbone; add department directories only for coverage gaps and deduplicate cross-appointments.

sources:
  - source_id: academic_structure
    role: organizational_scope
    url: https://www.hkbu.edu.hk/en/about/faculties.html
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Official faculties, schools and academic departments page.
  - source_id: research_profiles
    role: research_profile
    url: https://scholars.hkbu.edu.hk/en/persons/
    official: true
    access_state: browser_only
    observed_http_status: 403
    note: Institution-wide Elsevier Pure profile index; automated HTTP probe met an anti-bot page.
  - source_id: research_degrees
    role: research_degree
    url: https://gs.hkbu.edu.hk/page/detail/1313
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Graduate School confirms MPhil and PhD programmes and directs applicants to HKBU Scholars for supervisors.

academic_units:
  - {unit_id: faculty_arts_social_sciences, name: Faculty of Arts and Social Sciences, unit_type: faculty, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: school_business, name: School of Business, unit_type: school, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: school_chinese_medicine, name: School of Chinese Medicine, unit_type: school, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: school_communication, name: School of Communication, unit_type: school, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: school_creative_arts, name: School of Creative Arts, unit_type: school, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: faculty_science, name: Faculty of Science, unit_type: faculty, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: school_continuing_education, name: School of Continuing Education, unit_type: school, scope_status: include, evidence_source_id: academic_structure}

coverage:
  unit_inventory_granularity: top_level_and_cross_faculty_academic_units
  top_level_unit_count: 7
  all_top_level_units_accounted_for: true
  people_source_present: true
  research_degree_evidence_present: true
  discovery_status: complete
  adapter_readiness: conditional

adapter_assessment:
  coverage_strategy: Research portal as the initial whole-university backbone, followed by unit-level completeness checks.
  template_hypotheses:
    - {source_id: research_profiles, template_family: elsevier_pure_portal, confidence: high}
  known_constraints:
    - The research portal is browser-only from the current automated HTTP client.
    - School of Continuing Education staff remain in scope when listed as academic or research personnel.
  next_step: Test a compliant Pure access strategy, then create an Adapter Config v2 with department-directory fallbacks where required.

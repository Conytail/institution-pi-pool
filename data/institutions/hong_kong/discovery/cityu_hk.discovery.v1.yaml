manifest_version: 1
institution_id: cityu_hk
checked_at: "2026-07-13"
baseline_tag: baseline-v0.1

identity:
  official_name: City University of Hong Kong
  ror_id: https://ror.org/03q8dnn23
  homepage_url: https://www.cityu.edu.hk
  official_domains: [cityu.edu.hk]

scope:
  type: institution
  name: Whole institution
  population: academic_and_research_personnel
  inclusion_rule: Academic and research staff listed by official academic or research units, regardless of title; preserve appointment status as metadata.
  exclusions:
    - Current students and research postgraduate profiles
    - Administrative staff without an academic or research appointment
  membership_policy: Include official academic and research staff without inferring eligibility from title; contact and appointment review remain separate.
  research_unit_policy: Use the central people directory as the person backbone; add research-unit-only staff only when absent, and deduplicate cross-appointments.

sources:
  - source_id: academic_structure
    role: organizational_scope
    url: https://www.cityu.edu.hk/en/academic/colleges-schools-and-departments
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Official institution-wide colleges, schools and departments page.
  - source_id: academic_people
    role: people_directory
    url: https://www.cityu.edu.hk/en/directories/people/academic
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Institution-wide academic staff directory with profiles and pagination.
  - source_id: bios_people_api
    role: people_directory
    url: https://www.cityu.edu.hk/bios/people/profile/staffs.htm
    official: true
    access_state: browser_only
    observed_http_status: 200
    note: Compact official Biostatistics staff JSON; direct automated HTTP is Incapsula-protected, so the current replay cache uses a provenance-marked reader capture.
  - source_id: research_profiles
    role: research_profile
    url: https://scholars.cityu.edu.hk/en/persons/
    official: true
    access_state: browser_only
    observed_http_status: 403
    note: Elsevier Pure research profiles; automated HTTP probe met an anti-bot page.
  - source_id: research_degrees
    role: research_degree
    url: https://www.cityu.edu.hk/en/pg/research-degree-programmes/research-areas
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Institution research-degree areas and programme-level supervision context.


coverage:
  unit_inventory_granularity: department_school_and_academic_centre
  top_level_unit_count: 32
  all_top_level_units_accounted_for: true
  people_source_present: true
  research_degree_evidence_present: true
  discovery_status: complete
  adapter_readiness: ready

adapter_assessment:
  coverage_strategy: Federated official department directories and unit APIs as the repeatable backbone; central directory is cross-coverage evidence and the research portal is enrichment only.
  template_hypotheses:
    - {source_id: academic_people, template_family: central_paginated_academic_directory, confidence: high}
    - {source_id: academic_structure, template_family: federated_department_people_directories, confidence: high}
    - {source_id: research_profiles, template_family: elsevier_pure_portal, confidence: high}
  known_constraints:
    - The central directory and four legacy department pages may trigger Incapsula from the automated HTTP client.
    - The Biostatistics staff JSON is complete and compact, but currently requires a provenance-marked reader capture for offline replay.
    - Department pages use several recurring templates and require person-card boundary plus current-membership validation; titles are not eligibility filters.
  next_step: Run the federated Adapter, repair transient captures, and validate all 32 units against academic_structure.

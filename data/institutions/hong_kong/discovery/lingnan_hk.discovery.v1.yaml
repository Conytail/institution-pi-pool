schema_version: 1
manifest_version: 1
institution_id: lingnan_hk
checked_at: "2026-07-13"
baseline_tag: baseline-v0.1

identity:
  official_name: Lingnan University
  ror_id: https://ror.org/0563pg902
  homepage_url: https://www.ln.edu.hk
  official_domains: [ln.edu.hk]

scope:
  type: institution
  name: Whole institution
  population: academic_and_research_personnel
  inclusion_rule: Academic and research staff listed by official academic or research units, regardless of title; preserve appointment status as metadata.
  exclusions:
    - Current students and research postgraduate profiles
    - Administrative staff without an academic or research appointment
  membership_policy: Include official academic and research staff without inferring eligibility from title; contact and appointment review remain separate.
  research_unit_policy: Use Lingnan Scholars affiliations as the person backbone; include research-institute-only staff and deduplicate all cross-appointments.

sources:
  - source_id: academic_structure
    role: organizational_scope
    url: https://commons.ln.edu.hk/fac_units/
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Official faculties, departments and research units collection.
  - source_id: research_profiles
    role: research_profile
    url: https://scholars.ln.edu.hk/en/persons/
    official: true
    access_state: browser_only
    observed_http_status: 403
    note: Institution-wide Elsevier Pure profile index; automated HTTP probe met an anti-bot page.
  - source_id: research_units
    role: organizational_scope
    url: https://scholars.ln.edu.hk/en/organisations/research-institutes-centres-and-programmes/
    official: true
    access_state: browser_only
    observed_http_status: 403
    note: Research-unit affiliations can contain staff not obvious from faculty landing pages.
  - source_id: research_degrees
    role: research_degree
    url: https://www.ln.edu.hk/rpg/admission/list-of-programmes
    official: true
    access_state: reachable
    observed_http_status: 200
    note: Current MPhil and PhD programme list.

academic_units:
  - {unit_id: faculty_arts, name: Faculty of Arts, unit_type: faculty, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: faculty_business, name: Faculty of Business, unit_type: faculty, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: faculty_social_sciences, name: Faculty of Social Sciences, unit_type: faculty, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: school_data_science, name: School of Data Science, unit_type: school, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: school_graduate_studies, name: School of Graduate Studies, unit_type: school, scope_status: include, evidence_source_id: academic_structure}
  - {unit_id: wu_jieh_yee_interdisciplinary_studies, name: Wu Jieh Yee School of Interdisciplinary Studies, unit_type: school, scope_status: include, evidence_source_id: academic_structure}

coverage:
  unit_inventory_granularity: top_level_and_cross_faculty_academic_units
  top_level_unit_count: 6
  all_top_level_units_accounted_for: true
  people_source_present: true
  research_degree_evidence_present: true
  discovery_status: complete
  adapter_readiness: conditional

adapter_assessment:
  coverage_strategy: Pure profile and organisation indexes as the backbone, including standalone research institutes and centres.
  template_hypotheses:
    - {source_id: research_profiles, template_family: elsevier_pure_portal, confidence: high}
    - {source_id: academic_structure, template_family: bepress_digital_commons, confidence: high}
  known_constraints:
    - Pure indexes are browser-only from the current automated HTTP client.
    - The portal includes students and multiple appointment types; current institutional membership and person-profile evidence must be validated without title-based eligibility filtering.
  next_step: Establish compliant profile-index access and create an Adapter Config v2 with explicit membership and person-profile evidence checks.
